name: ci

on:
  push:
    branches: [main]
    paths:
      - "setup.py"
      - ".github/workflows/ci.yml"
      - "python/**"
      - "seqio.c"
      - "seqio.h"

jobs:
  test-on-linux:
    name: Linux ${{ matrix.arch }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: [39, 310, 311, 312, 313, 314]
        arch: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up QEMU
        if: ${{ matrix.arch == 'aarch64' }}
        uses: docker/setup-qemu-action@v1
      - name: set zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: build static zlib for linux
        if: ${{ matrix.arch == 'x86_64' }}
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux-gnu.2.17
      - name: build static zlib for linux
        if: ${{ matrix.arch == 'aarch64' }}
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-gnu.2.17
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel -U

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp${{ matrix.python-version }}-*"
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS: ${{ matrix.arch }}

  test-on-windows:
    name: Windows for ${{ matrix.arch }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python-version: [39, 310, 311, 312, 313, 314]
        arch: [AMD64]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: build static zlib for windows
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-windows-msvc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel -U

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp${{ matrix.python-version }}-*"
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS: ${{ matrix.arch }}

  test-on-macos:
    name: MacOS ${{ matrix.arch }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-13' || 'macos-latest' }}
    strategy:
      matrix:
        python-version: [39, 310, 311, 312, 313, 314]
        arch: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Build static seqio library for macOS (native toolchain)
        run: |
          mkdir -p zig-out/lib /tmp/fastseqio-macos-build
          cc -std=c99 -O3 -I. -I./deps/zlib -c ./seqio.c -o /tmp/fastseqio-macos-build/seqio.o
          for src in ./deps/zlib/*.c; do
            obj="/tmp/fastseqio-macos-build/$(basename "${src%.c}.o")"
            cc -std=c89 -O2 -I./deps/zlib -c "$src" -o "$obj"
          done
          ar -rcs ./zig-out/lib/libseqio.a /tmp/fastseqio-macos-build/*.o
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel -U
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp${{ matrix.python-version }}-*"
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS: ${{ matrix.arch }}